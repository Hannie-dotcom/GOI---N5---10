<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Minna no Nihongo - Bài 10</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.55), rgba(240, 220, 225, 0.65)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng Cánh hoa anh đào rơi */
        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute;
            background: #ffb7c5;
            border-radius: 15px 0 15px 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(120px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 28px;
            padding: 32px 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(180, 100, 120, 0.15);
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #b06d7e; margin-bottom: 20px; }

        /* Flashcard Lật 3D */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 230px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.12);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #f2d5db;
            background: #ffffff;
            padding: 16px;
        }
        .card-front { color: #3a2e30; }
        .card-back {
            background: #fff8f9;
            color: #d85a7f;
            transform: rotateY(180deg);
        }

        .kanji-text { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
        .hint-text { font-size: 12px; color: #b06d7e; margin-top: 10px; opacity: 0.8; }
        
        .hiragana-text { font-size: 22px; font-weight: 600; color: #d85a7f; margin-bottom: 2px; }
        .meaning-text { font-size: 18px; font-weight: 700; color: #4a383b; margin-bottom: 10px; }
        
        /* Khung câu ví dụ */
        .example-box {
            background: rgba(216, 90, 127, 0.08);
            border-left: 3px solid #d85a7f;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #5a4046;
            text-align: left;
            width: 100%;
        }
        .example-jp { font-weight: 600; color: #3a2e30; }
        .example-vi { font-size: 12px; color: #7a5c63; }

        /* Danh sách 4 lựa chọn tiếng Việt */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #f2d5db;
            color: #4a383b;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .opt-btn:hover:not(:disabled) { background: #fff5f7; border-color: #d85a7f; transform: translateY(-1px); }
        .opt-btn.correct { background: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .opt-btn.wrong { background: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }
        .opt-btn:disabled { cursor: default; }

        .controls { display: flex; gap: 10px; margin-top: 16px; }
        .nav-btn {
            flex: 1; padding: 12px; border: none; background: #f2d5db; color: #8c5665;
            font-weight: 600; border-radius: 14px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { background: #d85a7f; color: white; }

        /* Màn hình Chúc mừng khi hoàn thành */
        .congrats-card {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }
        .congrats-icon { font-size: 60px; margin-bottom: 12px; }
        .congrats-title { font-size: 24px; font-weight: 700; color: #d85a7f; margin-bottom: 8px; }
        .congrats-desc { font-size: 15px; color: #5a4046; margin-bottom: 24px; line-height: 1.5; }
        .restart-btn {
            background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white; border: none; padding: 14px 32px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(216, 90, 127, 0.3);
        }
        .restart-btn:hover { opacity: 0.95; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <!-- Khung học Flashcard chính -->
        <div id="learning-section">
            <div class="header">
                <span id="lesson-title">Minna no Nihongo - Bài 10</span>
                <span id="card-count">1 / 34</span>
            </div>

            <!-- Flashcard lật 3D -->
            <div class="flashcard-wrapper" onclick="toggleFlip()">
                <div class="flashcard" id="card">
                    <div class="card-front">
                        <div class="kanji-text" id="kanji-display">あります</div>
                        <div class="hint-text">💡 Chạm vào đây để lật xem cách đọc & ví dụ</div>
                    </div>
                    <div class="card-back">
                        <div class="hiragana-text" id="hiragana-display">あります</div>
                        <div class="meaning-text" id="meaning-display">Có (dùng cho đồ vật)</div>
                        <div class="example-box">
                            <div class="example-jp" id="example-jp">あそこに コンビニが あります。</div>
                            <div class="example-vi" id="example-vi">Ở đằng kia có cửa hàng tiện lợi.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4 Lựa chọn trắc nghiệm tiếng Việt -->
            <div class="options-grid" id="options-box">
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
            </div>

            <!-- Điều hướng -->
            <div class="controls">
                <button class="nav-btn" onclick="prevCard()">← Thẻ trước</button>
                <button class="nav-btn" onclick="nextCard()">Thẻ tiếp →</button>
            </div>
        </div>

        <!-- Màn hình Chúc mừng sau khi hoàn thành -->
        <div class="congrats-card" id="congrats-section">
            <div class="congrats-icon">🌸🎉</div>
            <div class="congrats-title">おめでとうございます!</div>
            <div class="congrats-desc">
                Chúc mừng bạn đã hoàn thành trọn bộ <strong>34 từ vựng Bài 10</strong>!<br>
                Điểm số trả lời đúng: <strong id="score-text" style="color:#d85a7f;">0/34</strong>
            </div>
            <button class="restart-btn" onclick="restartLesson()">🔄 Học lại Bài 10</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 8 + 8 + 'px';
            p.style.height = Math.random() * 10 + 10 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // Danh sách từ vựng Bài 10 trích xuất chính xác từ sách Minna no Nihongo I
        const vocabList = [
            { kanji: 'あります', hiragana: 'あります', meaning: 'Có (dùng cho đồ vật)', exJp: 'あそこに コンビニが あります。', exVi: 'Ở đằng kia có cửa hàng tiện lợi.' },
            { kanji: 'います', hiragana: 'います', meaning: 'Có / Ở (dùng cho người, động vật)', exJp: 'ロビーに 佐藤さんが います。', exVi: 'Chị Sato ở đại sảnh.' },
            { kanji: 'いろいろ［な］', hiragana: 'いろいろ［な］', meaning: 'Nhiều / Đa dạng', exJp: '箱の中に いろいろな 物が あります。', exVi: 'Trong hộp có nhiều đồ vật.' },
            { kanji: '男の人', hiragana: 'おとこのひと', meaning: 'Người đàn ông', exJp: 'あそこに 男の人が います。', exVi: 'Ở đằng kia có một người đàn ông.' },
            { kanji: '女の人', hiragana: 'おんなのひと', meaning: 'Người phụ nữ', exJp: '女の人が います。', exVi: 'Có một người phụ nữ.' },
            { kanji: '男の子', hiragana: 'おとこのこ', meaning: 'Cậu bé / Cậu con trai', exJp: '公園に 男の子が います。', exVi: 'Ở công viên có một cậu bé.' },
            { kanji: '女の子', hiragana: 'おんなのこ', meaning: 'Cô bé / Cô con gái', exJp: '女の子が います。', exVi: 'Có một cô bé.' },
            { kanji: '犬', hiragana: 'いぬ', meaning: 'Chó / Con chó', exJp: '庭に 犬が います。', exVi: 'Trong vườn có con chó.' },
            { kanji: '猫', hiragana: 'ねこ', meaning: 'Mèo / Con mèo', exJp: '庭に 猫が います。', exVi: 'Trong vườn có con mèo.' },
            { kanji: '木', hiragana: 'き', meaning: 'Cây / Gỗ', exJp: '公園に 大きい 木が あります。', exVi: 'Ở công viên có cây lớn.' },
            { kanji: '物', hiragana: 'もの', meaning: 'Đồ vật / Vật', exJp: '箱の中に 物が あります。', exVi: 'Ở trong hộp có đồ vật.' },
            { kanji: '電池', hiragana: 'でんち', meaning: 'Pin', exJp: '箱の中に 電池が あります。', exVi: 'Trong hộp có pin.' },
            { kanji: '箱', hiragana: 'はこ', meaning: 'Hộp / Cái hộp', exJp: '箱の中に 何が ありますか。', exVi: 'Trong hộp có cái gì?' },
            { kanji: 'スイッチ', hiragana: 'すいっち', meaning: 'Công tắc', exJp: 'ドアの 近くに スイッチが あります。', exVi: 'Ở gần cửa ra vào có công tắc.' },
            { kanji: '冷蔵庫', hiragana: 'れいぞうこ', meaning: 'Tủ lạnh', exJp: '冷蔵庫の中に 牛乳が あります。', exVi: 'Trong tủ lạnh có sữa bò.' },
            { kanji: 'テーブル', hiragana: 'てーぶる', meaning: 'Bàn / Bàn ăn', exJp: 'テーブルの上に 本が あります。', exVi: 'Trải trên bàn có quyển sách.' },
            { kanji: 'ベッド', hiragana: 'べっど', meaning: 'Giường', exJp: '部屋に ベッドが あります。', exVi: 'In phòng có cái giường.' },
            { kanji: '棚', hiragana: 'たな', meaning: 'Giá / Kệ (sách)', exJp: '棚の上に 写真が あります。', exVi: 'Trên giá sách có bức ảnh.' },
            { kanji: 'ドア', hiragana: 'どあ', meaning: 'Cửa ra vào', exJp: 'ドアの 近くに スイッチが あります。', exVi: 'Ở gần cửa ra vào có công tắc.' },
            { kanji: '窓', hiragana: 'まど', meaning: 'Cửa sổ', exJp: '窓の 近くに テーブルが あります。', exVi: 'Gần cửa sổ có cái bàn.' },
            { kanji: 'ポスト', hiragana: 'ぽすと', meaning: 'Hộp thư / Hòm thư', exJp: '駅の 近くに ポストが あります。', exVi: 'Ở gần nhà ga có hộp thư.' },
            { kanji: 'ビル', hiragana: 'びる', meaning: 'Tòa nhà / Cao ốc', exJp: 'あそこに 白い ビルが あります。', exVi: 'Ở đằng kia có tòa nhà màu trắng.' },
            { kanji: '公園', hiragana: 'こうえん', meaning: 'Công viên', exJp: '駅の 近くに 公園が あります。', exVi: 'Gần nhà ga có công viên.' },
            { kanji: '喫茶店', hiragana: 'きっさてん', meaning: 'Quán cà phê / Quán giải khát', exJp: 'スーパーの 隣に 喫茶店が あります。', exVi: 'Bên cạnh siêu thị có quán cà phê.' },
            { kanji: '本屋', hiragana: 'ほんや', meaning: 'Hiệu sách', exJp: '本屋は 花屋の 隣に あります。', exVi: 'Hiệu sách ở bên cạnh cửa hàng hoa.' },
            { kanji: '～屋', hiragana: '～や', meaning: 'Cửa hàng ～ / Hiệu ～', exJp: 'パン屋で パンを 買います。', exVi: 'Tôi mua bánh mì ở cửa hàng bánh mì.' },
            { kanji: '乗り場', hiragana: 'のりば', meaning: 'Điểm đón (xe/tàu/tắc-xi)', exJp: 'タクシー乗り場は どこですか。', exVi: 'Điểm đón tắc-xi ở đâu?' },
            { kanji: '県', hiragana: 'けん', meaning: 'Tỉnh (đơn vị hành chính)', exJp: 'ディズニーランドは 千葉県に あります。', exVi: 'Disneyland nằm ở tỉnh Chiba.' },
            { kanji: '上', hiragana: 'うえ', meaning: 'Trên / Bên trên', exJp: '机の上に 写真が あります。', exVi: 'Trên bàn có bức ảnh.' },
            { kanji: '下', hiragana: 'した', meaning: 'Dưới / Bên dưới', exJp: 'ナンプラーは いちばん 下です。', exVi: 'Nước mắm ở kệ dưới cùng.' },
            { kanji: '前', hiragana: 'まえ', meaning: 'Trước / Đằng trước', exJp: '銀行の 前に 郵便局が あります。', exVi: 'Trước ngân hàng có bưu điện.' },
            { kanji: '後ろ', hiragana: 'うしろ', meaning: 'Sau / Đằng sau', exJp: 'ビルの 後ろに 公園が あります。', exVi: 'Đằng sau tòa nhà có công viên.' },
            { kanji: '右', hiragana: 'みぎ', meaning: 'Phải / Bên phải', exJp: '箱の 右に 時計が あります。', exVi: 'Bên phải cái hộp có cái đồng hồ.' },
            { kanji: '左', hiragana: 'ひだり', meaning: 'Trái / Bên trái', exJp: '本の 左に ペンが あります。', exVi: 'Bên trái quyển sách có cái bút.' }
        ];

        const extraDistractors = [
            "Học tập", "Làm việc", "Nghỉ ngơi", "Bưu điện", "Ngân hàng",
            "Mỗi sáng", "Thứ hai", "Tối nay", "Căn phòng", "Máy vi tính"
        ];

        let currentIndex = 0;
        let answeredCurrent = false;
        let correctCount = 0;

        function updateCard() {
            const current = vocabList[currentIndex];
            document.getElementById('card-count').innerText = `${currentIndex + 1} / ${vocabList.length}`;
            document.getElementById('kanji-display').innerText = current.kanji;
            document.getElementById('hiragana-display').innerText = current.hiragana;
            document.getElementById('meaning-display').innerText = current.meaning;
            document.getElementById('example-jp').innerText = current.exJp;
            document.getElementById('example-vi').innerText = current.exVi;
            
            document.getElementById('card').classList.remove('flipped');
            answeredCurrent = false;

            let options = [current.meaning];
            vocabList.forEach(item => {
                if (!options.includes(item.meaning) && options.length < 4) {
                    options.push(item.meaning);
                }
            });

            let distractorIndex = 0;
            while (options.length < 4 && distractorIndex < extraDistractors.length) {
                let text = extraDistractors[distractorIndex];
                if (!options.includes(text)) {
                    options.push(text);
                }
                distractorIndex++;
            }

            options.sort(() => Math.random() - 0.5);

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach((btn, i) => {
                btn.innerText = options[i];
                btn.className = 'opt-btn';
                btn.disabled = false;
            });
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function checkAnswer(btn) {
            if(answeredCurrent) return;
            answeredCurrent = true;

            document.getElementById('card').classList.add('flipped');

            if(btn.innerText === vocabList[currentIndex].meaning) {
                btn.classList.add('correct');
                correctCount++;
            } else {
                btn.classList.add('wrong');
            }

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);
        }

        function nextCard() {
            if (currentIndex === vocabList.length - 1) {
                showCongrats();
                return;
            }
            currentIndex++;
            updateCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function showCongrats() {
            document.getElementById('learning-section').style.display = 'none';
            document.getElementById('congrats-section').style.display = 'flex';
            document.getElementById('score-text').innerText = `${correctCount} / ${vocabList.length}`;
        }

        function restartLesson() {
            currentIndex = 0;
            correctCount = 0;
            document.getElementById('congrats-section').style.display = 'none';
            document.getElementById('learning-section').style.display = 'block';
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
